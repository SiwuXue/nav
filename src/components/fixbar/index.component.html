<div class="fixbar" [class.openFixbar]="open" [attr.aria-label]="$t('_quickTools')">
  <button
    type="button"
    class="action common-show"
    nz-dropdown
    [nzDropdownMenu]="menu"
    nzTrigger="click"
    nzPlacement="topLeft"
    *ngIf="settings.showThemeToggle"
    [attr.aria-label]="$t('_theme')"
    [title]="$t('_theme')"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3.5" y="3.5" width="7" height="7" rx="1.8" />
      <rect x="13.5" y="3.5" width="7" height="7" rx="1.8" />
      <rect x="3.5" y="13.5" width="7" height="7" rx="1.8" />
      <rect x="13.5" y="13.5" width="7" height="7" rx="1.8" />
    </svg>
  </button>
  <nz-dropdown-menu #menu="nzDropdownMenu">
    <ul nz-menu nzSelectable class="fixbar-theme-menu">
      <li
        nz-menu-item
        *ngFor="let themeItem of themeList"
        (click)="toggleTheme(themeItem)"
      >
        {{ themeItem.name }}
      </li>
    </ul>
  </nz-dropdown-menu>

  <button
    type="button"
    class="action common-show"
    (click)="handleSync()"
    *ngIf="isLogin && !isSelfDevelop"
    [attr.aria-label]="$t('_syncData')"
    [title]="$t('_syncData')"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20 7v5h-5M4 17v-5h5" />
      <path d="M5.5 9A7.5 7.5 0 0 1 18.2 6.8L20 12M4 12l1.8 5.2A7.5 7.5 0 0 0 18.5 15" />
    </svg>
  </button>

  <button
    type="button"
    class="action common-show"
    (click)="unregisterServiceWorkers()"
    *ngIf="isPwaMode"
    [attr.aria-label]="$t('_refresh')"
    [title]="$t('_refresh')"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" [class.spinning]="checking">
      <path d="M20 11a8 8 0 1 0-2.3 6.1M20 5v6h-6" />
    </svg>
  </button>

  <button
    type="button"
    *ngIf="isLogin || isPwaMode"
    class="action common-show"
    (click)="goSystemPage()"
    [attr.aria-label]="$t('_manageSite')"
    [title]="$t('_manageSite')"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" [class.spinning]="entering">
      <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
      <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
      <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
      <path d="M14 17h6M17 14v6" />
    </svg>
  </button>

  <button
    type="button"
    class="action common-show"
    (click)="collapse()"
    *ngIf="showCollapse"
    nz-tooltip
    [nzTooltipTitle]="collapsed ? $t('_collapse') : $t('_put')"
    [attr.aria-label]="collapsed ? $t('_collapse') : $t('_put')"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2.5" />
      <path d="M9 4v16" />
      <path class="collapse-arrow" [class.is-collapsed]="collapsed" d="m16 9-3 3 3 3" />
    </svg>
  </button>

  <button
    type="button"
    class="action common-show mode-action"
    [class.is-active]="isDark"
    (click)="toggleMode()"
    nz-tooltip
    [nzTooltipTitle]="isDark ? $t('_closeDark') : $t('_openDark')"
    [attr.aria-label]="isDark ? $t('_closeDark') : $t('_openDark')"
    [attr.aria-pressed]="isDark"
  >
    <svg class="mode-icon moon-icon" [class.visible]="!isDark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20.3 15.2A8.4 8.4 0 0 1 8.8 3.7 8.5 8.5 0 1 0 20.3 15.2Z" />
      <path d="m17.5 4.5.35 1.2 1.15.35-1.15.35-.35 1.15-.35-1.15L16 6.05l1.15-.35z" />
    </svg>
    <svg class="mode-icon sun-icon" [class.visible]="isDark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="3.5" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
  </button>

  <button
    type="button"
    *ngIf="settings.showLanguage"
    class="action common-show"
    (click)="toggleLocale()"
    [attr.aria-label]="$t('_switchLanguage')"
    [title]="$t('_switchLanguage')"
  >
    <span class="locale-glyph" aria-hidden="true">{{ language === 'zh-CN' ? '中' : 'EN' }}</span>
  </button>

  <button
    type="button"
    class="action scrolltop"
    (click)="goTop()"
    [class.showTop]="isShowTop || open"
    *ngIf="showTop"
    [attr.aria-label]="$t('_backToTop')"
    [title]="$t('_backToTop')"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 19V5m-6 6 6-6 6 6" />
    </svg>
  </button>

  <button
    type="button"
    class="action toggle-action"
    (click)="handleOpen()"
    *ngIf="isShowFace"
    [attr.aria-label]="open ? $t('_hideTools') : $t('_showTools')"
    [attr.aria-expanded]="open"
    [title]="open ? $t('_hideTools') : $t('_showTools')"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" [class.is-open]="open">
      <path d="M12 5v14M5 12h14" />
    </svg>
  </button>
</div>
